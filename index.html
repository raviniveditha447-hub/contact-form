<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <!-- Freshworks CRM Tracking Code -->
    <script src="//in.fw-cdn.com/31428335/695758.js" chat="true"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:#fff;
            width:420px;
            padding:35px;
            border-radius:10px;
            box-shadow:0 8px 25px rgba(0,0,0,.12);
        }

        h1{
            text-align:center;
            color:#1565c0;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
            color:#444;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:6px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:6px;
            background:#1565c0;
            color:#fff;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0d47a1;
        }

        #success{
            display:none;
            margin-top:20px;
            padding:15px;
            background:#d4edda;
            color:#155724;
            border-radius:6px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Contact Us</h1>

    <p>Please fill in your details below.</p>

    <form id="contactForm">

        <label for="firstname">First Name</label>
        <input
            type="text"
            id="firstname"
            name="firstname"
            required>

        <label for="lastname">Last Name</label>
        <input
            type="text"
            id="lastname"
            name="lastname"
            required>

        <label for="email">Email ID</label>
        <input
            type="email"
            id="email"
            name="email"
            required>

        <button type="submit">
            Submit
        </button>

    </form>

    <div id="success">
        Thank you! Your details have been submitted successfully.
    </div>

</div>

<script>

document.getElementById("contactForm").addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("contactForm").style.display="none";

    document.getElementById("success").style.display="block";

});

</script>

    <script>
  var WebFormEvent = {
    beforeSubmit: function () {
      // Define mapping of localStorage keys to form field names
      const utmMapping = {
        "_fm_oc": "contact[first_campaign]",
        "_fm_om": "contact[first_medium]",
        "_fm_os": "contact[first_source]",
        "_fm_rc": "contact[latest_campaign]",
        "_fm_rm": "contact[latest_medium]",
        "_fm_rs": "contact[latest_source]"
        "_gcl_ls": "contact[custom_field][cf_gcl_hidden]",
      };

      // Function to get UTM values from localStorage
      function getLocalStorageValue(key) {
        return window.localStorage.getItem(key) || "";
      }

      // Append hidden fields dynamically
      for (const [storageKey, formFieldName] of Object.entries(utmMapping)) {
        const value = getLocalStorageValue(storageKey);
        if (value) {
          WebForm.$('<input>').attr({
            type: 'hidden',
            name: formFieldName,
            value: value
          }).appendTo('.fs-webform-container form');
        }
      }
    }
  };

    </script>

</body>
</html>
