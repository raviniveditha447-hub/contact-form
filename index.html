<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshsales Classic Web Form Test</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #666;
        }
    </style>

    <!-- Capture GCLID from URL -->
    <script>
    (function () {

        const params = new URLSearchParams(window.location.search);
        const gclid = params.get("gclid");

        if (gclid) {
            localStorage.setItem("gclid", gclid);
            console.log("✅ GCLID stored:", gclid);
        } else {
            console.log("No GCLID found in URL.");
        }

    })();
    </script>

</head>

<body>

<div class="container">

<h1>Freshsales Classic Web Form</h1>

<p>Testing GCLID + Freshsales CRM Integration</p>

<!-- Freshsales Classic Web Form -->

<script
src="https://annapurnisrinivasan.myfreshworks.com/crm/sales/web_forms/c21a8da395c5734617002eac9c2200b0be94bd63478a064ac6a937654a543c98/form.js"
crossorigin="anonymous"
id="fs_c21a8da395c5734617002eac9c2200b0be94bd63478a064ac6a937654a543c98">
</script>

</div>

<script>

(function () {

    function populateGclid() {

        const gclid = localStorage.getItem("gclid");

        console.log("Stored GCLID:", gclid);

        if (!gclid) {
            console.log("No GCLID available.");
            return;
        }

        const field = document.querySelector(
            'input[name="contact[custom_field][cf_gcl_hidden]"]'
        );

        if (!field) {
            console.log("Waiting for Freshsales form...");
            setTimeout(populateGclid, 500);
            return;
        }

        field.value = gclid;

        console.log("✅ Hidden field populated.");

        console.log(field.value);

    }

    window.addEventListener("load", function () {

        setTimeout(populateGclid, 1000);

    });

})();
</script>

</body>
</html>
